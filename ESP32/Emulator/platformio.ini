; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:4d_systems_esp32s3_gen4_r8n16]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
upload_port = COM8
upload_speed = 921600
; Musi byc zgodne z Serial.begin() w Emulator.cpp — przy 115200 logowanie ramek
; (DEBUG_FRAMES) zajmuje kilkanascie procent czasu petli i opoznia odpowiedzi.
monitor_speed = 921600
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
build_flags = 
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D ARDUINO_USB_DFU_ON_BOOT=0
	-D ARDUINO_USB_MSC_ON_BOOT=0
	-D ARDUINO_RUNNING_CORE=1
	-D ARDUINO_EVENT_RUNNING_CORE=1
	-D CORE_DEBUG_LEVEL=0
lib_deps = esphome/ESP32-audioI2S@^2.3.0
extra_scripts = pre:read_secret.py

